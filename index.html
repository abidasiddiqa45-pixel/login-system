<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
  <div class="auth-card">
    <h1>Sign in</h1>
    <p class="subtitle">Enter your email and password to continue.</p>

    <form action="dashboard.html" method="get">
      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" placeholder="name@example.com" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Your password" required>
      </div>

      <div class="form-row">
        <label class="checkbox"><input type="checkbox" name="remember"> Keep me signed in</label>
        <a href="#">Forgot password?</a>
      </div>

      <button type="submit" class="btn">Sign in</button>
    </form>

    <p class="switch-text">New here? <a href="register.html">Create an account</a></p>
  </div>
</body>
</html>
